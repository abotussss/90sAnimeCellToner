[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anime-celify"
version = "0.1.0"
description = "Deterministic CLI tool for shifting short anime mp4 clips toward a 90s cyber-noir cel look."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "scenedetect>=0.6.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
anime-celify = "anime_celify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_celify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

